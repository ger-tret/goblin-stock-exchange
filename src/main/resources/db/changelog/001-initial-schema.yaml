databaseChangeLog:
  - changeSet:
      id: 1
      author: ger-tret
      changes:
        - createTable:
            tableName: brokers
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: gold_balance
                  type: DECIMAL(19, 4)
                  constraints:
                    nullable: false
              - column:
                  name: reputation
                  type: int
                  defaultValueNumeric: 0
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP

  - changeSet:
      id: 2
      author: ger-tret
      changes:
        - createTable:
            tableName: assets
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: ticker
                  type: VARCHAR(10)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: asset_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: base_price
                  type: DECIMAL(19, 4)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT

  - changeSet:
      id: 3
      author: ger-tret
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: broker_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_broker
                    referencedTableName: brokers
                    referencedColumnNames: id
              - column:
                  name: asset_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_asset
                    referencedTableName: assets
                    referencedColumnNames: id
              - column:
                  name: order_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: order_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(19, 4)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP